<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <g fill="#64748b" font-size="16" letter-spacing="1.2" text-anchor="middle" font-weight="700">
    <text x="120" y="170">1 · PENGGUNA</text>
    <text x="350" y="170">2 · ADMIN</text>
    <text x="580" y="170">3 · ADMIN</text>
    <text x="810" y="170">4 · PENGGUNA</text>
    <text x="1040" y="170">5 · ADMIN</text>
  </g>

  <g>
    <rect x="20" y="190" width="200" height="145" rx="10" fill="#eff6ff" stroke="#93b4f5" stroke-width="2"/>
    <text x="120" y="230" text-anchor="middle" font-size="30" font-weight="700" fill="#0f2c5c">Mengirim</text>
    <text x="120" y="262" text-anchor="middle" font-size="30" font-weight="700" fill="#0f2c5c">pengajuan</text>
    <text x="120" y="300" text-anchor="middle" font-size="19" fill="#475569">Barang &amp; jumlah</text>
  </g>

  <g>
    <rect x="250" y="190" width="200" height="145" rx="10" fill="#eff6ff" stroke="#93b4f5" stroke-width="2"/>
    <text x="350" y="230" text-anchor="middle" font-size="30" font-weight="700" fill="#0f2c5c">Memeriksa</text>
    <text x="350" y="262" text-anchor="middle" font-size="30" font-weight="700" fill="#0f2c5c">pengajuan</text>
    <text x="350" y="300" text-anchor="middle" font-size="19" fill="#475569">Setujui / tolak</text>
  </g>

  <g>
    <rect x="480" y="190" width="200" height="145" rx="10" fill="#eff6ff" stroke="#93b4f5" stroke-width="2"/>
    <text x="580" y="230" text-anchor="middle" font-size="30" font-weight="700" fill="#0f2c5c">Mencatat</text>
    <text x="580" y="262" text-anchor="middle" font-size="30" font-weight="700" fill="#0f2c5c">distribusi</text>
    <text x="580" y="300" text-anchor="middle" font-size="19" fill="#475569">Menu Distribusi</text>
  </g>

  <g>
    <rect x="710" y="190" width="200" height="145" rx="10" fill="#eff6ff" stroke="#93b4f5" stroke-width="2"/>
    <text x="810" y="230" text-anchor="middle" font-size="30" font-weight="700" fill="#0f2c5c">Mengunggah</text>
    <text x="810" y="262" text-anchor="middle" font-size="30" font-weight="700" fill="#0f2c5c">bukti</text>
    <text x="810" y="300" text-anchor="middle" font-size="19" fill="#475569">Foto penerimaan</text>
  </g>

  <g>
    <rect x="940" y="190" width="200" height="145" rx="10" fill="#eff6ff" stroke="#93b4f5" stroke-width="2"/>
    <text x="1040" y="230" text-anchor="middle" font-size="30" font-weight="700" fill="#0f2c5c">Verifikasi</text>
    <text x="1040" y="262" text-anchor="middle" font-size="30" font-weight="700" fill="#0f2c5c">bukti</text>
    <text x="1040" y="300" text-anchor="middle" font-size="19" fill="#475569">Status Selesai</text>
  </g>

  <g stroke="#1d4ed8" stroke-width="2.6" marker-end="url(#arrow)">
    <line x1="224" y1="262" x2="242" y2="262"/>
    <line x1="454" y1="262" x2="472" y2="262"/>
    <line x1="684" y1="262" x2="702" y2="262"/>
    <line x1="914" y1="262" x2="932" y2="262"/>
  </g>
  <text x="460" y="248" font-size="17" fill="#1d4ed8" font-weight="700">Ya</text>

  <line x1="350" y1="339" x2="350" y2="421" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arrowRed)"/>
  <text x="363" y="388" font-size="18" fill="#dc2626" font-weight="700">Tidak</text>

  <g>
    <rect x="250" y="428" width="200" height="92" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="350" y="466" text-anchor="middle" font-size="26" font-weight="700" fill="#991b1b">Ditolak</text>
    <text x="350" y="494" text-anchor="middle" font-size="18" fill="#7f1d1d">Tidak masuk laporan</text>
  </g>

  <line x1="1040" y1="339" x2="1040" y2="350" stroke="#16a34a" stroke-width="2.4" marker-end="url(#arrowGreen)"/>
  <g>
    <rect x="940" y="354" width="200" height="38" rx="19" fill="#dcfce7" stroke="#86efac" stroke-width="1.6"/>
    <text x="1040" y="379" text-anchor="middle" font-size="18" fill="#166534" font-weight="700">Masuk laporan</text>
  </g>

  <text x="20" y="512" font-size="17" fill="#475569">Catatan: stok berkurang saat pengajuan <tspan font-weight="700">disetujui</tspan>, bukan saat distribusi dicatat.</text>

</svg>
