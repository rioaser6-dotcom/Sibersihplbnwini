<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="18" font-weight="700" fill="#0f2c5c" letter-spacing="1.2">STATUS PENGAJUAN</text>

  <g>
    <rect x="20" y="60" width="220" height="90" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
    <text x="130" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#92400e">Menunggu</text>
    <text x="130" y="126" text-anchor="middle" font-size="16" fill="#78350f">belum diputuskan</text>
  </g>

  <g>
    <rect x="320" y="60" width="220" height="90" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
    <text x="430" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#1e40af">Disetujui</text>
    <text x="430" y="126" text-anchor="middle" font-size="16" fill="#1e3a8a">stok sudah berkurang</text>
  </g>

  <g>
    <rect x="620" y="60" width="220" height="90" rx="10" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
    <text x="730" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#5b21b6">Didistribusi</text>
    <text x="730" y="126" text-anchor="middle" font-size="16" fill="#4c1d95">barang sudah diserahkan</text>
  </g>

  <g>
    <rect x="920" y="60" width="220" height="90" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
    <text x="1030" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#166534">Selesai</text>
    <text x="1030" y="126" text-anchor="middle" font-size="16" fill="#14532d">bukti terverifikasi</text>
  </g>

  <g stroke="#1d4ed8" stroke-width="2.6" marker-end="url(#a1)">
    <line x1="244" y1="105" x2="312" y2="105"/>
    <line x1="544" y1="105" x2="612" y2="105"/>
    <line x1="844" y1="105" x2="912" y2="105"/>
  </g>
  <g font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle">
    <text x="278" y="92">Setujui</text>
    <text x="578" y="92">Distribusi</text>
    <text x="878" y="92">Verifikasi</text>
  </g>

  <g>
    <rect x="320" y="250" width="220" height="84" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
    <text x="430" y="286" text-anchor="middle" font-size="24" font-weight="700" fill="#991b1b">Ditolak</text>
    <text x="430" y="312" text-anchor="middle" font-size="16" fill="#7f1d1d">tidak dapat dilanjutkan</text>
  </g>
  <path d="M278,105 L278,292 L312,292" fill="none" stroke="#dc2626" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="288" y="210" font-size="14" font-weight="700" fill="#dc2626">Tolak</text>

  <text x="20" y="366" font-size="18" font-weight="700" fill="#0f2c5c" letter-spacing="1.2">STATUS BUKTI PENERIMAAN</text>
  <text x="20" y="390" font-size="15" fill="#64748b">Berlaku selama pengajuan berstatus Didistribusi.</text>

  <g>
    <rect x="20" y="460" width="240" height="80" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="140" y="495" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">Belum dikirim</text>
    <text x="140" y="520" text-anchor="middle" font-size="15" fill="#475569">belum ada foto</text>
  </g>

  <g>
    <rect x="300" y="460" width="240" height="80" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
    <text x="420" y="495" text-anchor="middle" font-size="21" font-weight="700" fill="#92400e">Menunggu verifikasi</text>
    <text x="420" y="520" text-anchor="middle" font-size="15" fill="#78350f">bukti sudah diunggah</text>
  </g>

  <g>
    <rect x="580" y="460" width="240" height="80" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
    <text x="700" y="495" text-anchor="middle" font-size="21" font-weight="700" fill="#991b1b">Perlu dikirim ulang</text>
    <text x="700" y="520" text-anchor="middle" font-size="15" fill="#7f1d1d">diminta perbaikan</text>
  </g>

  <g>
    <rect x="880" y="460" width="240" height="80" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
    <text x="1000" y="495" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">Terverifikasi</text>
    <text x="1000" y="520" text-anchor="middle" font-size="15" fill="#14532d">pengajuan Selesai</text>
  </g>

  <g stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#a1)">
    <line x1="264" y1="500" x2="292" y2="500"/>
    <line x1="544" y1="500" x2="572" y2="500"/>
  </g>
  <g font-size="12.5" fill="#1d4ed8" font-weight="700" text-anchor="middle">
    <text x="280" y="451">Unggah</text>
    <text x="540" y="451">Minta perbaikan</text>
  </g>

  <path d="M420,460 C420,430 460,425 520,425 L920,425 C970,425 1000,435 1000,456"
        fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="710" y="416" text-anchor="middle" font-size="13.5" fill="#1d4ed8" font-weight="700">Admin memverifikasi</text>

  <path d="M700,540 C700,575 670,585 620,585 L480,585 C450,585 420,565 420,544"
        fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a3)"/>
  <text x="560" y="615" text-anchor="middle" font-size="13.5" fill="#475569" font-weight="700">Pengguna mengunggah ulang</text>

  <text x="20" y="675" font-size="15" fill="#475569">Status pengajuan tetap <tspan font-weight="700">Didistribusi</tspan> sampai Admin memverifikasi bukti penerimaan.</text>

</svg>

